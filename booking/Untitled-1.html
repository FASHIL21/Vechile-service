<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Store</title>
    <style>
        body { font-family: Arial; margin: 0; }
        header { background: #ffc107; padding: 20px; text-align: center; }
        .products { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .product { border: 1px solid #ddd; padding: 10px; width: 200px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Stationery Store</h1>
    </header>

    <section class="products">
        <div class="product">
            <img src="pen.jpg" width="150">
            <h3>Blue Pen</h3>
            <p>$1.50</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="notebook.jpg" width="150">
            <h3>Notebook</h3>
            <p>$3.00</p>
            <button>Add to Cart</button>
        </div>
    </section>
</body>
</html>
